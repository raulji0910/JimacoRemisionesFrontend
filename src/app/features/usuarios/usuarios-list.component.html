<div class="usuarios">
  <div class="usuarios__header">
    <h2>Usuarios</h2>
    <button mat-flat-button color="primary" (click)="abrirNuevo()">
      <mat-icon>add</mat-icon>
      Nuevo usuario
    </button>
  </div>

  @if (cargando()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <table mat-table [dataSource]="usuarios()" class="tabla-responsiva">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let usuario" data-label="Nombre">{{ usuario.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>Correo</th>
      <td mat-cell *matCellDef="let usuario" data-label="Correo">{{ usuario.email }}</td>
    </ng-container>

    <ng-container matColumnDef="rol">
      <th mat-header-cell *matHeaderCellDef>Rol</th>
      <td mat-cell *matCellDef="let usuario" data-label="Rol">{{ usuario.rol === 'Admin' ? 'Administrador' : usuario.rol === 'Sincronizador' ? 'Sincronizador (servicio)' : 'Operador' }}</td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef>Estado</th>
      <td mat-cell *matCellDef="let usuario" data-label="Estado">
        <mat-chip [class.usuarios__chip--activo]="usuario.activo" [class.usuarios__chip--inactivo]="!usuario.activo">
          {{ usuario.activo ? 'Activo' : 'Inactivo' }}
        </mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let usuario" data-label="">
        <button mat-icon-button (click)="abrirEditar(usuario)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnas"></tr>
    <tr mat-row *matRowDef="let usuario; columns: columnas"></tr>

    <tr class="usuarios__vacio-fila" *matNoDataRow>
      <td [attr.colspan]="columnas.length" class="usuarios__vacio">No hay usuarios registrados.</td>
    </tr>
  </table>
</div>
