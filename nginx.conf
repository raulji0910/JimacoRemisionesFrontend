server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://jimaco-remisiones-api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # La página principal nunca se guarda en caché: es la que apunta a los archivos con hash de cada
    # versión. Sin esto, tras una actualización el navegador puede seguir con el index.html viejo y
    # cargar JavaScript de la versión anterior (los .js/.css sí se guardan 30 días porque su nombre
    # cambia con cada compilación).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|ico|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
